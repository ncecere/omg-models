id = "openai"
name = "OpenAI"
type = "cloud"
website = "https://openai.com"
api_base = "https://api.openai.com/v1"
api_style = "openai-chat"
auth = "Bearer API key in the Authorization header."
env = ["OPENAI_API_KEY"]
docs = "https://developers.openai.com/api/docs"
