[package]
name = "omg-models-web"
description = "Open Model Catalog website and static JSON API (Topcoat)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
omg-models-catalog.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
topcoat = { workspace = true, features = [
    "asset",
    "compression",
    "discover",
    "font",
    "router",
    "serve",
    "tailwind",
    "ui",
    "view",
] }

[build-dependencies]
topcoat = { workspace = true, features = ["tailwind"] }

[dev-dependencies]
http = "=1.5.0"
tokio.workspace = true

[lints]
workspace = true
