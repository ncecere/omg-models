# Hourly price sync: compare the catalog with LiteLLM, OpenRouter,
# genai-prices (cross-check) and models.dev (metadata), and keep one pull
# request from the `bot/price-updates` branch up to date.
#
# Policy (README, "Sync policy"):
# - label `auto-merge` when the only changes are new prices for previously
#   unpriced offerings, filled metadata, or rates that moved within ±25%,
#   with no disagreement from the cross-check source on a changed offering;
#   GitHub auto-merge is then enabled and merges once required checks pass.
# - label `needs-review` otherwise (larger moves, newly listed meters, tier
#   changes, inexact values, disagreements, removals, unavailable sources).
#
# Setup (repository settings, once):
# - Settings > General > Pull Requests: allow auto-merge (and squash).
# - Settings > Actions > General: allow GitHub Actions to create and approve
#   pull requests.
# - Branch protection on main requiring the CI checks (`rust`, `cargo-deny`,
#   `actionlint`, `container`), so auto-merge waits for them.
#
# GITHUB_TOKEN caveats: pull requests and pushes made with it do not trigger
# other workflows, so this job dispatches ci.yml on the bot branch itself
# (its checks attach to the PR's head commit), and the merge into main does
# not trigger the image build. To rebuild the image after bot merges, either
# merge or push on main afterwards, run image.yml by hand, or store a GitHub
# App / fine-grained token with contents+pull-requests write as the
# `PRICE_SYNC_TOKEN` secret (used instead of GITHUB_TOKEN when present).
name: sync

on:
  schedule:
    - cron: "17 * * * *" # hourly, away from the top of the hour
  workflow_dispatch:

permissions: {}

concurrency:
  group: price-sync
  cancel-in-progress: false

env:
  BRANCH: bot/price-updates
  CARGO_TERM_COLOR: always

jobs:
  sync:
    if: github.repository == 'ncecere/omg-models'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # push the bot branch
      pull-requests: write # open/update the PR, labels, auto-merge
      actions: write # dispatch ci.yml on the bot branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.PRICE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Rust toolchain
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Conditional requests: unchanged sources are not downloaded again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sync/cache
          key: price-sources-${{ github.run_id }}
          restore-keys: price-sources-

      - name: Build
        run: cargo build --locked --release -p omg-models

      - name: Sync
        id: sync
        env:
          # Raises the GitHub API limit for pinning sources to a commit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./target/release/omg-models sync \
            --report "${RUNNER_TEMP}/report.md" \
            --summary "${RUNNER_TEMP}/summary.json" > /dev/null
          code=$?
          set -e
          if [ "${code}" -eq 2 ]; then
            echo "::warning::a primary price source was unavailable; see the report"
          elif [ "${code}" -ne 0 ]; then
            exit "${code}"
          fi
          cat "${RUNNER_TEMP}/report.md" >> "$GITHUB_STEP_SUMMARY"
          label=$(jq -r .label "${RUNNER_TEMP}/summary.json")
          echo "label=${label}" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close a stale bot PR (sources match main again)
        if: steps.sync.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.PRICE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [ -n "${pr}" ]; then
            gh pr close "${pr}" --delete-branch \
              --comment "The sources now match main; nothing to update."
          fi

      - name: Push the bot branch
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${BRANCH}"
          git add data
          git commit --quiet -m "Price sync $(jq -r .today "${RUNNER_TEMP}/summary.json")" \
            -m "Label: ${LABEL}. Generated by .github/workflows/sync.yml; see the PR body for sources and changes."
          # One rolling branch, rebuilt from main on every run.
          git push --force origin "${BRANCH}"
        env:
          LABEL: ${{ steps.sync.outputs.label }}

      - name: Open or update the pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRICE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          LABEL: ${{ steps.sync.outputs.label }}
        run: |
          gh label create auto-merge --color 0e8a16 --description "Small price sync change; merges when CI passes" --force
          gh label create needs-review --color d93f0b --description "Price sync change that needs a human" --force
          gh label create price-sync --color 4b4fd6 --description "Automated price sync" --force
          title="Price sync: $(jq -r '[.price_changes | length, .metadata_fills | length] | "\(.[0]) price change(s), \(.[1]) metadata fill(s)"' "${RUNNER_TEMP}/summary.json")"
          pr=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [ -z "${pr}" ]; then
            gh pr create --base main --head "${BRANCH}" --title "${title}" \
              --body-file "${RUNNER_TEMP}/report.md" --label price-sync
            pr=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number')
          else
            gh pr edit "${pr}" --title "${title}" --body-file "${RUNNER_TEMP}/report.md"
          fi
          if [ "${LABEL}" = "auto-merge" ]; then
            gh pr edit "${pr}" --add-label auto-merge --remove-label needs-review
            gh pr merge "${pr}" --auto --squash
          else
            gh pr edit "${pr}" --add-label needs-review --remove-label auto-merge
            gh pr merge "${pr}" --disable-auto || true
          fi

      # PRs and pushes made with GITHUB_TOKEN do not start workflows; run
      # the checks on the bot branch explicitly so auto-merge can proceed.
      - name: Run CI on the bot branch
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "${BRANCH}"
