# Publishes the catalog data as a rolling GitHub release, `data-latest`, so
# running servers (`omg-models serve --data-url ...`) pick up data changes
# without a new image or a deploy commit (docs/operations.md).
#
# Runs on pushes to main and hourly at :20 (after sync.yml at :17). The
# schedule matters: price-sync merges made with GITHUB_TOKEN do not trigger
# `push` workflows, but the next scheduled run publishes them.
#
# Each run builds `omg-models package` from main HEAD:
#   catalog.tar.gz         data/ (the TOML files) and dist/ (the JSON API)
#   catalog.manifest.json  commit, built_at, every file's SHA-256, the
#                          archive's SHA-256, data_sha256, total_sha256 and
#                          the manifest schema_version
# and uploads both (overwriting the assets) only when total_sha256 differs
# from the published manifest's. The manifest is signed with cosign keyless
# (`catalog.manifest.json.sigstore.json`); it pins the archive's SHA-256, so
# verifying it covers the archive. Every run keeps the manifest as a
# workflow artifact attached to the commit.
#
# Every action is pinned by commit SHA; the comment gives the version.
name: publish-data

on:
  push:
    branches: [main]
    paths:
      - data/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/publish-data.yml
  schedule:
    - cron: "20 * * * *" # hourly, after sync.yml (:17)
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-data
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: data-latest

jobs:
  publish:
    # Only main's own workflow file publishes (and signs: the certificate
    # identity is publish-data.yml@refs/heads/main).
    if: github.repository == 'ncecere/omg-models' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # cosign keyless signing of the manifest (Sigstore OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rust toolchain
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Build
        run: cargo build --locked --release -p omg-models

      - name: Validate and build dist/
        run: |
          ./target/release/omg-models validate --data data
          ./target/release/omg-models build --data data --out dist

      # The package re-validates data/ and rebuilds dist/ in memory; the
      # archive is reproducible (sorted entries, zero mtimes).
      - name: Package
        env:
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          ./target/release/omg-models package --data data \
            --out "${RUNNER_TEMP}/package" --commit "${SHA}"
          jq -e --arg sha "${SHA}" '.commit == $sha and .schema_version == 1' \
            "${RUNNER_TEMP}/package/catalog.manifest.json" > /dev/null
          # dist/ in the archive is exactly what `build` wrote.
          mkdir -p "${RUNNER_TEMP}/unpacked"
          tar -xzf "${RUNNER_TEMP}/package/catalog.tar.gz" -C "${RUNNER_TEMP}/unpacked"
          diff -r dist "${RUNNER_TEMP}/unpacked/dist"
          diff -r --exclude='.*' data "${RUNNER_TEMP}/unpacked/data"

      - name: Keep the manifest with this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-manifest-${{ steps.head.outputs.sha }}
          path: ${{ runner.temp }}/package/catalog.manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Compare with the published snapshot
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new=$(jq -r .total_sha256 "${RUNNER_TEMP}/package/catalog.manifest.json")
          old=""
          mkdir -p "${RUNNER_TEMP}/published"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            if gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --pattern catalog.manifest.json --dir "${RUNNER_TEMP}/published" --clobber; then
              old=$(jq -r '.total_sha256 // ""' "${RUNNER_TEMP}/published/catalog.manifest.json" || true)
            fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "published total_sha256: ${old:-none}"
          echo "built     total_sha256: ${new}"
          if [ "${new}" = "${old}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.compare.outputs.changed == 'true'

      - name: Sign the manifest (cosign keyless)
        if: steps.compare.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}/package
        run: |
          cosign sign-blob --yes \
            --bundle catalog.manifest.json.sigstore.json \
            catalog.manifest.json

      # The archive goes first: a server reading the old manifest meanwhile
      # still finds a matching archive or fails its checksum and retries on
      # its next interval, keeping the data it has.
      - name: Publish to the data-latest release
        if: steps.compare.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}/package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_EXISTS: ${{ steps.compare.outputs.release }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          if [ "${RELEASE_EXISTS}" != "true" ]; then
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --target "${SHA}" --prerelease --latest=false \
              --title "Catalog data (rolling)" \
              --notes "Rolling catalog data snapshot, replaced by .github/workflows/publish-data.yml whenever the data changes. The tag does not move; catalog.manifest.json names the commit. See docs/operations.md."
          fi
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber catalog.tar.gz
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
            catalog.manifest.json catalog.manifest.json.sigstore.json

      - name: Job summary
        env:
          CHANGED: ${{ steps.compare.outputs.changed }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          manifest="${RUNNER_TEMP}/package/catalog.manifest.json"
          {
            echo "## Catalog data"
            echo
            if [ "${CHANGED}" = "true" ]; then
              echo "Published \`${TAG}\` from \`${SHA}\`."
            else
              echo "Unchanged: the published snapshot has the same content (\`${SHA}\` not republished)."
            fi
            echo
            echo "- files: $(jq '.files | length' "${manifest}")"
            echo "- total_sha256: \`$(jq -r .total_sha256 "${manifest}")\`"
            echo "- data_sha256: \`$(jq -r .data_sha256 "${manifest}")\`"
            if [ "${CHANGED}" = "true" ]; then
              echo
              echo "Verify the manifest signature:"
              echo
              echo '```'
              echo "cosign verify-blob catalog.manifest.json \\"
              echo "  --bundle catalog.manifest.json.sigstore.json \\"
              echo "  --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-data.yml@refs/heads/main \\"
              echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
